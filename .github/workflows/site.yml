name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Jekyll
        run: |
          gem install jekyll -v 3.10.0 --no-document
          gem install jekyll-seo-tag -v 2.8.0 --no-document
          gem install jekyll-feed -v 0.17.0 --no-document
          gem install jekyll-sitemap -v 1.4 --no-document

      - name: Build
        run: jekyll build

      - name: Check output
        run: python3 scripts/check_site.py _site
