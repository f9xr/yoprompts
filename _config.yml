title: "YoPrompts"
author: "F9XR Team"
description: >-
  Ready-made AI prompts crafted by F9XR Team to help you write better, create
  faster, and get better results from ChatGPT, Claude, Gemini, and your
  favorite AI tools.
tagline: "Think. Prompt. Create. Copy. Paste. Repeat."

# TODO(inanj): confirm before first deploy. These are GitHub Pages project-site
# defaults for github.com/f9xr/yoprompts. Correct them if a custom domain or
# user/org site is used instead.
url: "https://f9xr.github.io"
baseurl: "/yoprompts"

email: ""

rss: rss

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

collections:
  prompts:
    output: true
    permalink: /prompts/:slug/

defaults:
  - scope:
      path: ""
      type: prompts
    values:
      layout: prompt
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      tags: Guide

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - skills
  - DESIGN.md
  - todo.txt
  - demo-html-site
  - README.md
  - .kilo