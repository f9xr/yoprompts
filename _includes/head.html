<!-- Site build date: {{ "now" | date: "%FT%T%z" }} -->
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Google Discover requires a large image preview. Emitting this explicitly
       guarantees og:image (1200x630, set in defaults) is eligible for the
       large card rather than the thumbnail. -->
  <meta name="robots" content="max-image-preview:large">
  <meta name="theme-color" content="#0a0a0a">

  <!-- Begin SEO -->
  {%- seo -%}
  <!-- End SEO -->

  <!-- Agent / crawler discovery. These <link> relations mirror the
       Link response headers in _headers (RFC 8288). GitHub Pages cannot emit
       custom HTTP headers, so the HTML form is what is actually served here;
       the header form activates automatically on a CDN that reads _headers. -->
  <link rel="author" href="https://f9xr.org">
  <link rel="me" href="https://github.com/f9xr">
  <link rel="sitemap" type="application/xml" href="{{ '/sitemap.xml' | relative_url }}">
  <link rel="service-doc" href="{{ '/resources/' | relative_url }}">
  <link rel="api-catalog" type="application/linkset+json" href="{{ '/.well-known/api-catalog' | relative_url }}">
  <link rel="license" href="{{ '/terms/' | relative_url }}">

  <!-- Google Consent Mode v2. Denied by default, before any analytics code is
       ever requested. main.js calls gtag('consent','update', …) only if the
       visitor accepts, then injects the gtag.js script at that point. Nothing
       here sets a cookie or sends a request; it only records the default. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { window.dataLayer.push(arguments); }
    gtag('consent', 'default', {
      analytics_storage: 'denied',
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied',
      functionality_storage: 'denied',
      personalization_storage: 'denied',
      security_storage: 'denied',
      wait_for_update: 500
    });
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400&amp;family=JetBrains+Mono:wght@400&amp;display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400&amp;family=JetBrains+Mono:wght@400&amp;display=swap">

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">

  {%- feed_meta -%}
</head>
