{%- comment -%}
  Copy action for a prompt. Expects `include.copy_key`, either "body" on a
  prompt detail page, or "src-<slug>" for a card whose prompt text lives in a
  hidden source script.

  Optional: include.copy_label (defaults to "Copy Prompt").
{%- endcomment -%}
<button class="button {% if include.copy_sm %}button--sm{% endif %}{% if include.copy_block %} button--block{% endif %}" type="button" data-copy="{{ include.copy_key }}">
  {% include icon.html name='copy' class='button__icon button__icon--copy' %}
  {% include icon.html name='check' class='button__icon button__icon--check' %}
  <span class="button__label">{{ include.copy_label | default: 'Copy Prompt' }}</span>
</button>
