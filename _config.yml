title: "YoPrompts"# Declared as a mapping rather than a bare string so jekyll-seo-tag emits# `"@type": "Organization"` in JSON-LD. A plain string makes it guess "Person",# which is wrong for a team name and was flagged in the audit.author:  name: "F9XR Team"  type: "Organization"  url: "https://f9xr.org"description: >-  Ready-made AI prompts crafted by F9XR Team to help you write better, create  faster, and get better results from ChatGPT, Claude, Gemini, and your  favorite AI tools.tagline: "Think. Prompt. Create. Copy. Paste. Repeat."# Custom domain. `CNAME` at the repo root must contain the same hostname or# GitHub Pages will not serve this. Changing either value here is enough to# re-point every canonical, og:url, sitemap <loc> and robots.txt Sitemap line.url: "https://f9xr.org"baseurl: "/yoprompts"email: "hello@f9xr.org"# Only the logo is set at site level. The share image and card type are injected# into every page through `defaults` further down, for two reasons:## 1. jekyll-seo-tag 2.8.0's ImageDrop reads `page["image"]` only and has no#    site-level fallback, so a top-level `image:` is silently ignored and no#    og:image is emitted anywhere.
logo: "https://f9xr.org/logo.webp"